<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình phát Video 360 VR</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r105/three.min.js"></script>
    <script src="https://pellepim.github.io/three-js-mods/js/panolens.min.js"></script>

    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        /* Màn hình chờ bắt buộc kích hoạt cảm biến & âm thanh */
        #welcome-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .btn-play {
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            background-color: #00e676;
            color: #000;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,230,118,0.4);
            transition: 0.3s;
            margin-top: 20px;
        }
        .btn-play:active {
            transform: scale(0.95);
        }
        #container {
            width: 100%; height: 100%;
        }
    </style>
</head>
<body>

    <div id="welcome-screen">
        <h2>TRẢI NGHIỆM VIDEO 360°</h2>
        <p>Bấm nút bên dưới để cấp quyền xoay màn hình và phát video</p>
        <button class="btn-play" id="start-btn">XEM NGAY</button>
    </div>

    <div id="container"></div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const welcomeScreen = document.getElementById('welcome-screen');
        const container = document.getElementById('container');

        // ĐƯỜNG LINK VIDEO 360 CỦA BẠN (Thay đổi tại đây nếu muốn)
        const videoUrl = 'https://stemkoski.github.io/Three.js/videos/Backyard.mp4';

        startBtn.addEventListener('click', function () {
            // 1. Ẩn màn hình chờ đi
            welcomeScreen.style.display = 'none';

            // 2. Yêu cầu quyền cảm biến chuyển động (Bắt buộc cho iPhone/iOS)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        khởi_tạo_video_360();
                    })
                    .catch(err => {
                        console.error(err);
                        khởi_tạo_video_360(); // Vẫn chạy nếu là Android không cần xin quyền
                    });
            } else {
                // Đối với Android hoặc máy tính thông thường
                khởi_tạo_video_360();
            }
        });

        function khởi_tạo_video_360() {
            // Tạo trình xem Panolens
            const viewer = new PANOLENS.Viewer({ 
                container: container,
                controlBar: true, // Hiện thanh điều khiển tua/phóng to
                autoHideControlBar: true
            });

            // Tạo đối tượng Video 360 độ
            const videoPanorama = new PANOLENS.VideoPanorama(videoUrl, { 
                autoplay: true, 
                muted: false,
                loop: true,
                playsinline: true,
                crossOrigin: 'anonymous'
            });

            // Thêm vào trình xem và kích hoạt cảm biến di động
            viewer.add(videoPanorama);
            
            // Lệnh kích hoạt cảm biến con quay hồi chuyển trên điện thoại
            viewer.enableControl(PANOLENS.Controls.DEVICEORIENTATION); 
        }
    </script>
</body>
</html>
