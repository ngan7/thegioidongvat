<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xem Video 360 độ VR</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <style>
        /* Giao diện nút bấm kích hoạt cảm biến và âm thanh */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .play-btn {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #ff4081;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <h2>Trải nghiệm Video 360° VR</h2>
        <p>Vui lòng nhấn nút dưới đây để cấp quyền cảm biến xoay và phát video.</p>
        <button class="play-btn" id="start-btn">BẮT ĐẦU XEM</button>
    </div>

    <a-scene loading-screen="enabled: false">
        
        <a-assets>
            <video id="video360" 
                   src="assets/thegioidongvat (1).mp4" 
                   autoplay 
                   loop 
                   crossorigin="anonymous" 
                   playsinline 
                   webkit-playsinline>
            </video>
        </a-assets>

        <a-videosphere src="#video360" rotation="0 -90 0"></a-videosphere>

        <a-camera look-controls="magicWindowTrackingEnabled: true; touchEnabled: true; reverseTouchDrag: false;">
        </a-camera>

    </a-scene>

    <script>
        const startBtn = document.getElementById('start-btn');
        const splashScreen = document.getElementById('splash-screen');
        const video = document.getElementById('video360');

        // Hàm kích hoạt sau khi user bấm nút
        startBtn.addEventListener('click', function () {
            // 1. Ẩn màn hình chờ
            splashScreen.style.display = 'none';

            // 2. Phát video (vượt qua cơ chế chặn autoplay của trình duyệt)
            video.play().catch(err => {
                console.log("Video không thể tự phát:", err);
            });

            // 3. Yêu cầu quyền truy cập Cảm biến (Đặc biệt quan trọng cho iOS từ 13+)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            console.log("Đã cấp quyền cảm biến thành công!");
                        } else {
                            alert("Bạn cần cấp quyền cảm biến để xoay được góc nhìn bằng điện thoại.");
                        }
                    })
                    .catch(console.error);
            }
        });
    </script>
</body>
</html>
