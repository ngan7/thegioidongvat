<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trải nghiệm WebVR 360 độ</title>
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <style>
        /* Giao diện màn hình chờ để xin quyền cảm biến và kích hoạt video */
        #vr-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .vr-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .vr-desc {
            font-size: 14px;
            color: #94a3b8;
            max-width: 300px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .vr-btn {
            padding: 14px 35px;
            font-size: 16px;
            font-weight: 600;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4);
            transition: all 0.2s;
        }
        .vr-btn:active {
            transform: scale(0.95);
            background-color: #2563eb;
        }
    </style>
</head>
<body>

    <div id="vr-overlay">
        <div class="vr-title">WEBVR 360° PLAYER</div>
        <div class="vr-desc">Vui lòng bấm nút bên dưới để kích hoạt cảm biến con quay hồi chuyển và phát video.</div>
        <button class="vr-btn" id="enter-vr-btn">BẮT ĐẦU TRẢI NGHIỆM</button>
    </div>

    <a-scene loading-screen="enabled: false" vr-mode-ui="enabled: true">
        
        <a-assets>
            <video id="video360" 
                   src="assets/dongvat.mp4" 
                   autoplay 
                   loop 
                   muted="false"
                   crossorigin="anonymous" 
                   playsinline 
                   webkit-playsinline>
            </video>
        </a-assets>

        <a-videosphere src="#video360" rotation="0 -90 0"></a-videosphere>

        <a-camera look-controls="magicWindowTrackingEnabled: true; touchEnabled: true; reverseTouchDrag: false;">
        </a-camera>

    </a-scene>

    <script>
        const enterBtn = document.getElementById('enter-vr-btn');
        const overlay = document.getElementById('vr-overlay');
        const myVideo = document.getElementById('video360');

        enterBtn.addEventListener('click', function () {
            // 1. Ẩn màn hình chờ đi để hiển thị không gian VR
            overlay.style.display = 'none';

            // 2. Phát video gốc (Lệnh này giúp vượt qua cơ chế chặn âm thanh của trình duyệt di động)
            myVideo.play().catch(function(error) {
                console.log("Trình duyệt chặn tự động phát, đang thử lại...", error);
            });

            // 3. Xin quyền cảm biến Gyroscope chuyển động (Cực kỳ quan trọng đối với iPhone)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            console.log("Đã được cấp quyền cảm biến!");
                        } else {
                            alert("Bạn đã từ chối quyền cảm biến. Hãy tải lại trang và cho phép để có thể xoay được góc nhìn nhé!");
                        }
                    })
                    .catch(console.error);
            }
        });
    </script>
</body>
</html>
